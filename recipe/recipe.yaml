schema_version: 1

package:
  name: hermit
  version: "0.1.0"

source:
  path: ..

build:
  noarch: python
  script: python -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
  run:
    - python >=3.10
    - numpy >=1.24
    - scipy
    - fenics-dolfinx >=0.9,<0.12
    - petsc4py
    - csdl_alpha
    - caddee_materials

tests:
  # Importing Hermit initializes MPI; hosted runners need loopback UCX transports.
  - script:
      - UCX_TLS=tcp,self,sm UCX_LOG_LEVEL=error python -c "import hermit; print(hermit.__version__)"
      - python -m pip check
    requirements:
      run:
        - pip

about:
  homepage: https://github.com/LSDOlab/Hermit
  license: LGPL-3.0-or-later
  license_file: LICENSE.txt
  summary: Reissner-Mindlin shell analysis in FEniCSx, connected to CSDL.
